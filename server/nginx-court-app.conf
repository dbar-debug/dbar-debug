# /etc/nginx/sites-available/court-app
# Встановити: sudo ln -s $(pwd)/nginx-court-app.conf /etc/nginx/sites-available/court-app

server {
    listen 80;
    server_name court-app.duckdns.org;

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Блок нижче додає Certbot автоматично після: sudo certbot --nginx -d court-app.duckdns.org
