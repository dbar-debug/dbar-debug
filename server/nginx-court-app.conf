# /etc/nginx/sites-available/court-app
# Встановити:
#   sudo cp nginx-court-app.conf /etc/nginx/sites-available/court-app
#   sudo ln -s /etc/nginx/sites-available/court-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Роздає Flutter web-додаток на / та проксіює API-ендпоінти на бекенд.
# І додаток, і API доступні на одній адресі (напр. http://100.77.97.16).

# ── Безпека ──────────────────────────────────────────────────────────
# Цей файл підключається всередині http{}, тож директиви нижче валідні тут.
#
# Обмеження частоти запитів (захист від масового вивантаження персональних
# даних і від запуску сотень Chromium через /search).
limit_req_zone $binary_remote_addr zone=court_api:10m    rate=2r/s;
limit_req_zone $binary_remote_addr zone=court_scrape:10m rate=6r/m;
limit_req_status 429;

# Лог без query string: у ньому ПІБ/РНОКПП і ?key=<токен>.
log_format court_noargs '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    # приймаємо будь-яке імʼя (Tailscale IP, localhost, duckdns)
    server_name _;

    # КЕП-логін і отримання справ можуть тривати 20-40с — збільшуємо таймаути
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    client_max_body_size 20m;

    # Спільні proxy-заголовки для всіх API-локацій (успадковуються)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    access_log /var/log/nginx/court-app.access.log court_noargs;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Доступ лише з Tailscale і локальної машини. Якщо додаток потрібен з
    # інтернету (duckdns + проброс порту) — закоментуйте ці три рядки: API
    # однаково вимагає токен (API_TOKEN), але кожен зайвий відкритий порт —
    # ризик.
    # allow 100.64.0.0/10;
    # allow 127.0.0.1;
    # deny  all;

    # ── API → бекенд (uvicorn на :8000) ──────────────────────────────
    # Авторизація — токеном на самому бекенді (Authorization: Bearer).
    # /docs і /openapi.json навмисно не проксіюються.
    location = /health        { proxy_pass http://127.0.0.1:8000; }
    location /search          { limit_req zone=court_scrape burst=3 nodelay; proxy_pass http://127.0.0.1:8000; }
    location /cabinet/        { limit_req zone=court_api burst=20 nodelay; proxy_pass http://127.0.0.1:8000; }
    location /hearings/       { limit_req zone=court_api burst=20 nodelay; proxy_pass http://127.0.0.1:8000; }
    location /status/         { limit_req zone=court_api burst=20 nodelay; proxy_pass http://127.0.0.1:8000; }
    location /decisions/      { limit_req zone=court_api burst=20 nodelay; proxy_pass http://127.0.0.1:8000; }
    location /person/         { limit_req zone=court_api burst=20 nodelay; proxy_pass http://127.0.0.1:8000; }
    location /debtors/        { limit_req zone=court_api burst=20 nodelay; proxy_pass http://127.0.0.1:8000; }
    location /edr/            { limit_req zone=court_api burst=20 nodelay; proxy_pass http://127.0.0.1:8000; }

    # ── Flutter web-додаток (статика) ────────────────────────────────
    # Файли лежать у /var/www/court-app (Nginx-user www-data має доступ;
    # домашні папки /home/... для www-data закриті — звідти буде 403).
    # Оновлення: server/deploy-web.sh (копіює свіжий build сюди).
    location / {
        root /var/www/court-app;
        try_files $uri $uri/ /index.html;
    }
}
