# /etc/nginx/sites-available/court-app
# Встановити:
#   sudo cp nginx-court-app.conf /etc/nginx/sites-available/court-app
#   sudo ln -s /etc/nginx/sites-available/court-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Роздає Flutter web-додаток на / та проксіює API-ендпоінти на бекенд.
# І додаток, і API доступні на одній адресі (напр. http://100.77.97.16).

server {
    listen 80;
    # приймаємо будь-яке імʼя (Tailscale IP, localhost, duckdns)
    server_name _;

    # КЕП-логін і отримання справ можуть тривати 20-40с — збільшуємо таймаути
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    client_max_body_size 20m;

    # Спільні proxy-заголовки для всіх API-локацій (успадковуються)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API → бекенд (uvicorn на :8000) ──────────────────────────────
    location = /health        { proxy_pass http://localhost:8000; }
    location /search          { proxy_pass http://localhost:8000; }
    location /cabinet/        { proxy_pass http://localhost:8000; }
    location /hearings/       { proxy_pass http://localhost:8000; }
    location /status/         { proxy_pass http://localhost:8000; }
    location /decisions/      { proxy_pass http://localhost:8000; }
    location /person/         { proxy_pass http://localhost:8000; }
    location /debtors/        { proxy_pass http://localhost:8000; }
    location /edr/            { proxy_pass http://localhost:8000; }
    location = /docs          { proxy_pass http://localhost:8000; }
    location /openapi.json    { proxy_pass http://localhost:8000; }

    # ── Flutter web-додаток (статика) ────────────────────────────────
    # Файли лежать у /var/www/court-app (Nginx-user www-data має доступ;
    # домашні папки /home/... для www-data закриті — звідти буде 403).
    # Оновлення: server/deploy-web.sh (копіює свіжий build сюди).
    location / {
        root /var/www/court-app;
        try_files $uri $uri/ /index.html;
    }
}
