# /etc/nginx/sites-available/court-app
# Встановити:
#   sudo cp nginx-court-app.conf /etc/nginx/sites-available/court-app
#   sudo ln -s /etc/nginx/sites-available/court-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name court-app.duckdns.org;

    # КЕП-логін і отримання справ можуть тривати 20-40с — збільшуємо таймаути
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    # Документи-рішення можуть бути великими
    client_max_body_size 20m;

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Після отримання сертифіката Certbot автоматично додасть окремий server{}
# блок на 443 з ssl_certificate. Запуск:
#   sudo certbot --nginx -d court-app.duckdns.org
# (потребує, щоб порт 80 був доступний ззовні — див. README-https.md,
#  або використайте DNS-01 challenge через DuckDNS, якщо 80 недоступний)
